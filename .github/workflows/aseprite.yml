
name: aseprite

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, leave empty for latest"
        required: false
  schedule:
    # Approximately every three days at 09:17 China Standard Time (UTC+8).
    - cron: "17 1 */3 * *"

permissions:
  contents: write

concurrency:
  group: aseprite-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve stable version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $requestedVersion = $env:REQUESTED_VERSION.Trim()

          if ($requestedVersion) {
            $version = $requestedVersion
            $shouldBuild = $true
            $reason = "manual version requested"
          }
          else {
            $headers = @{
              Accept = "application/vnd.github+json"
              Authorization = "Bearer $env:GH_TOKEN"
              "User-Agent" = "${{ github.repository }}"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            $release = Invoke-RestMethod `
              -Headers $headers `
              -Uri "https://api.github.com/repos/aseprite/aseprite/releases/latest"

            if ($release.draft -or $release.prerelease) {
              throw "GitHub returned a non-stable release: $($release.tag_name)"
            }

            $version = $release.tag_name
            if ($version -notmatch '^v[0-9]+(\.[0-9]+){2,3}$') {
              throw "Unexpected stable version tag: $version"
            }

            if ($env:EVENT_NAME -eq "workflow_dispatch") {
              $shouldBuild = $true
              $reason = "manual latest-version build"
            }
            else {
              $stateFile = ".github/last-built-version.txt"
              $lastBuilt = if (Test-Path $stateFile) {
                (Get-Content -Raw $stateFile).Trim()
              }
              else {
                ""
              }
              $shouldBuild = $lastBuilt -ne $version
              $reason = if ($shouldBuild) {
                "new stable release (previous: $lastBuilt)"
              }
              else {
                "already built"
              }
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "should_build=$($shouldBuild.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "### Aseprite version check" >> $env:GITHUB_STEP_SUMMARY
          "- Version: ``$version``" >> $env:GITHUB_STEP_SUMMARY
          "- Build: ``$shouldBuild``" >> $env:GITHUB_STEP_SUMMARY
          "- Reason: $reason" >> $env:GITHUB_STEP_SUMMARY

      - name: Build
        if: steps.version.outputs.should_build == 'true'
        id: build
        shell: cmd
        run: call build.cmd
        env:
          ASEPRITE_VERSION: ${{ steps.version.outputs.version }}

      - name: Archive
        if: steps.version.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-${{ steps.build.outputs.ASEPRITE_VERSION }}
          path: github
          if-no-files-found: error

      - name: Record successful scheduled build
        if: github.event_name == 'schedule' && steps.version.outputs.should_build == 'true'
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          Set-Content -Path ".github/last-built-version.txt" -Value $env:VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".github/last-built-version.txt"

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            exit 0
          }

          git commit -m "record successful Aseprite $env:VERSION build"
          git pull --rebase origin $env:DEFAULT_BRANCH
          git push origin "HEAD:$env:DEFAULT_BRANCH"
